<!DOCTYPE html>
<html lang="pl" data-theme="dark-oak">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14110f">
<title>NEON MAGNAT | Tycoon</title>
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/png" sizes="32x32" href="assets/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="assets/favicon-16x16.png">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<link rel="icon" type="image/svg+xml" href="assets/logo.svg">
</head>
<body>
<header>
<button id="ham" class="btn g sm" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24"><path d="M3 6h18M3 12h18M3 18h18"/></svg></button>
<img src="assets/logo.svg" width="30" height="30" alt="logo">
<div class="logo">NEON <b>MAGNAT</b> <span class="tag" id="hTagSub">STRATEGIA EKONOMICZNA</span></div>

<div style="margin-left:auto" class="row">
  <!-- Szybki wybór motywu -->
  <select id="hThemeSelect" style="max-width:130px;min-height:34px;padding:4px 8px;font-size:12px">
    <option value="dark-oak">Ciemny dąb</option>
    <option value="starry-night">Gwiezdna noc</option>
    <option value="industrial-slate">Grafit stalowy</option>
    <option value="forest-emerald">Leśny mech</option>
    <option value="obsidian">Obsydian</option>
  </select>

  <!-- Przełącznik języka PL / EN -->
  <button id="hLangBtn" class="btn g sm" style="min-width:44px;font-weight:700" title="Zmień język / Switch language">PL</button>

  <!-- Personalizacja układu GUI -->
  <button id="hGuiBtn" class="btn g sm" title="Układ GUI / Layout customizer">
    <svg class="ic" viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    <span class="gui-btn-text">Układ</span>
  </button>

  <span id="hCash" class="tag">-</span>
  <span id="hWs" class="tag">●</span>
  <button id="hOut" class="btn g sm" style="display:none">Wyloguj</button>
</div>
</header>

<div id="layout">
  <aside id="side"><nav id="nav"></nav></aside>
  <main id="app"></main>
</div>

<nav id="mnav"><div id="mnavIn"></div></nav>
<div id="toasts" aria-live="polite"></div>
<div id="modalRoot"></div>

<script src="js/app.js"></script>
</body>
</html>
